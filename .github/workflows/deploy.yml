name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]   # or your default branch (master, main, etc.)
  workflow_dispatch:     # allows manual triggering

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Bloqueja el desplegament si hi ha errors de tipus o de sintaxi Astro.
  # Sense aquesta feina, `astro build` pot passar encara que `astro check` falli.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      # Build + comprovació d'enllaços amb majúscules. Sense això, un canvi de
      # ruta pot passar en local (Windows no distingeix majúscules) i donar 404
      # a GitHub Pages.
      - name: Build and check links
        run: npm run verify

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Install, build, and upload your site
        uses: withastro/action@v5
        with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 22 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
