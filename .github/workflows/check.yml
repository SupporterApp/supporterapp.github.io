name: Check

# Comprovacions de tipus i de build en cada pull request, abans de fusionar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      # Compara cada enllaç contra els noms reals de fitxer. A Linux ja és
      # sensible a majúscules, però ho deixem explícit perquè el check falli
      # amb el mateix missatge que en local.
      - name: Check links (case-sensitive)
        run: npm run check:links
